<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Produto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <article class="card">
            <div class="card-imagem">
                <span class="selo">-20%</span>
                <img src="img/fone.jpg" alt="Fone de ouvido preto sobre fundo amarelo">
            </div>

            <div class="card-conteudo">
                <span class="categoria">Áudio</span>
                <h2 class="titulo">Fone Bluetooth Wave Pro</h2>
                <p class="descricao">
                    Fone over-ear com cancelamento de ruído, bateria de até 30 horas e almofadas macias para usar o dia todo.
                </p>

                <div class="precos">
                    <span class="preco-antigo">R$ 499,90</span>
                    <span class="preco">R$ 399,90</span>
                </div>
                <p class="parcelas">ou 10x de R$ 39,99 sem juros</p>

                <button class="botao" type="button">Comprar agora</button>
            </div>
        </article>
    </main>

</body>
</html>
