<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroLens.Photo • Instagram</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <div class="topo-conteudo">
      <span class="logo">Instagram</span>

      <div class="busca">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search">
      </div>

      <nav class="icones">
        <a href="#"><i class="fa-solid fa-house"></i></a>
        <a href="#"><i class="fa-regular fa-compass"></i></a>
        <a href="#"><i class="fa-regular fa-heart"></i></a>
        <a href="#"><i class="fa-regular fa-user"></i></a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="perfil">
      <div class="avatar">
        <img src="https://images.unsplash.com/photo-1473968512647-3e447244af8f?w=300&h=300&fit=crop" alt="Foto de perfil AeroLens">
      </div>

      <div class="info">
        <div class="linha-nome">
          <h1>AeroLens.Photo</h1>
          <button class="btn btn-seguir">Follow</button>
          <button class="btn">Message</button>
          <button class="btn-mais"><i class="fa-solid fa-ellipsis"></i></button>
        </div>

        <p class="bio">
          Aerial Photographer | Drone Pilot | Capturing perspectives you've never
          seen. DM for collaborations.
          <a href="#">#NovaEraDesafio08</a>
        </p>

        <ul class="stats">
          <li><strong>42</strong> Posts</li>
          <li><strong>1.5k</strong> Followers</li>
          <li><strong>310</strong> Following</li>
        </ul>
      </div>
    </section>

    <div class="abas">
      <a href="#" class="ativa"><i class="fa-solid fa-table-cells"></i></a>
      <a href="#"><i class="fa-regular fa-square-caret-right"></i></a>
      <a href="#"><i class="fa-regular fa-id-badge"></i></a>
    </div>

    <section class="grid">
      <div class="post">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&h=600&fit=crop" alt="Post 1">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 214</span><span><i class="fa-solid fa-comment"></i> 12</span></div>
      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=600&h=600&fit=crop" alt="Post 2">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 389</span><span><i class="fa-solid fa-comment"></i> 27</span></div>
      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=600&h=600&fit=crop" alt="Post 3">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 156</span><span><i class="fa-solid fa-comment"></i> 8</span></div>
      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=600&h=600&fit=crop" alt="Post 4">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 502</span><span><i class="fa-solid fa-comment"></i> 41</span></div>
      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600&h=600&fit=crop" alt="Post 5">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 273</span><span><i class="fa-solid fa-comment"></i> 19</span></div>
      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&h=600&fit=crop" alt="Post 6">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 98</span><span><i class="fa-solid fa-comment"></i> 5</span></div>
      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=600&h=600&fit=crop" alt="Post 7">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 331</span><span><i class="fa-solid fa-comment"></i> 22</span></div>
      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600&h=600&fit=crop" alt="Post 8">

      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&h=600&fit=crop" alt="Post 9">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 445</span><span><i class="fa-solid fa-comment"></i> 36</span></div>
      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&h=600&fit=crop" alt="Post 10">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 120</span><span><i class="fa-solid fa-comment"></i> 9</span></div>
      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=600&h=600&fit=crop" alt="Post 11">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 264</span><span><i class="fa-solid fa-comment"></i> 17</span></div>
      </div>
      <div class="post">
        <img src="https://images.unsplash.com/photo-1473773508845-188df298d2d1?w=600&h=600&fit=crop" alt="Post 12">
        <div class="overlay"><span><i class="fa-solid fa-heart"></i> 310</span><span><i class="fa-solid fa-comment"></i> 24</span></div>
      </div>
    </section>

  </main>

</body>
</html>
